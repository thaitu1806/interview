        .progress-text { text-align: center; margin-bottom: 10px; font-weight: 600; color: #555; }
        .section { background: #fff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }

        .section-content { padding: 0 24px 24px; display: none; }
        .section-content.open { display: block; }

        .topic-header { padding: 14px 18px; background: #fafafa; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .topic-title { font-weight: 600; color: #333; }
        .topic-level { font-size: 0.8em; padding: 2px 8px; border-radius: 4px; color: #fff; }
        .level-critical { background: #e53935; }
        .level-important { background: #fb8c00; }
        .level-good { background: #43a047; }
        .topic-detail { padding: 16px 18px; border-top: 1px solid #e8e8e8; display: none; }
        .topic-detail.open { display: block; }
        .topic-detail ul { padding-left: 20px; }
        .topic-detail li { margin-bottom: 8px; color: #555; }
        .topic-detail li strong { color: #333; }
        .key-points { background: #e3f2fd; padding: 12px 16px; border-radius: 6px; margin-top: 12px; }
        .key-points h4 { color: #1565c0; margin-bottom: 6px; }
        .interview-tip { background: #fff3e0; padding: 12px 16px; border-radius: 6px; margin-top: 12px; }
        .interview-tip h4 { color: #e65100; margin-bottom: 6px; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
        .checkbox-wrapper input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-wrapper label { cursor: pointer; font-size: 0.95em; color: #555; }
        .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.9em; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .controls { text-align: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95em; margin: 0 5px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #1a237e; color: #fff; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-danger { background: #e53935; color: #fff; }

        .bg-csharp { background: linear-gradient(135deg, #512da8, #7c4dff); }
        .bg-aspnet { background: linear-gradient(135deg, #1565c0, #42a5f5); }
        .bg-architecture { background: linear-gradient(135deg, #2e7d32, #66bb6a); }
        .bg-database { background: linear-gradient(135deg, #e65100, #ff9800); }
        .bg-devops { background: linear-gradient(135deg, #c62828, #ef5350); }
        .bg-testing { background: linear-gradient(135deg, #00695c, #26a69a); }

        @media print {
            body { background: #fff; padding: 10px; }
            .section { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
            .section-content { display: block !important; }
            .topic-detail { display: block !important; }
            .controls, .progress-bar, .progress-text { display: none; }
            .btn { display: none; }
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .section-header h2 { font-size: 1em; }
            .legend { flex-direction: column; align-items: center; }
        }
    </style>
</head>

        <div id="sections"></div>

function renderSections() {
    const container = document.getElementById('sections');
    let html = '';
    let checkboxId = 0;

    studyData.forEach((section, sIdx) => {
        html += `<div class="section">
            <div class="section-header ${section.cssClass}" onclick="toggleSection(${sIdx})">
                <h2>${section.title}</h2>
                <div>
                    <span class="badge">${section.topics.length} chủ đề</span>
                    <span class="arrow" id="arrow-${sIdx}">▼</span>
                </div>
            </div>
            <div class="section-content" id="section-${sIdx}">`;

        section.topics.forEach((topic, tIdx) => {
            const levelClass = topic.level === 'critical' ? 'level-critical' : topic.level === 'important' ? 'level-important' : 'level-good';
            const levelText = topic.level === 'critical' ? 'Bắt buộc' : topic.level === 'important' ? 'Quan trọng' : 'Nên biết';

            html += `<div class="topic">
                <div class="topic-header" onclick="toggleTopic(${sIdx},${tIdx})">
                    <span class="topic-title">${topic.name}</span>
                    <span class="topic-level ${levelClass}">${levelText}</span>
                </div>
                <div class="topic-detail" id="topic-${sIdx}-${tIdx}">
                    <ul>`;
            topic.points.forEach(p => { html += `<li>${p}</li>`; });
            html += `</ul>`;

            if (topic.keyPoints) {
                html += `<div class="key-points"><h4>💡 Điểm mấu chốt</h4><p>${topic.keyPoints}</p></div>`;
            }
            if (topic.interviewTip) {
                html += `<div class="interview-tip"><h4>🎤 Mẹo phỏng vấn</h4><p>${topic.interviewTip}</p></div>`;
            }

            html += `<div class="checkbox-wrapper">
                        <input type="checkbox" id="cb-${checkboxId}" onchange="updateProgress()">
                        <label for="cb-${checkboxId}">Đã ôn xong chủ đề này</label>
                    </div>`;
            checkboxId++;
            html += `</div></div>`;
        });

        html += `</div></div>`;
    });

    container.innerHTML = html;
    loadProgress();
}

function toggleSection(idx) {
    const content = document.getElementById(`section-${idx}`);
    const arrow = document.getElementById(`arrow-${idx}`);
    content.classList.toggle('open');
    arrow.classList.toggle('open');
}

function toggleTopic(sIdx, tIdx) {
    const detail = document.getElementById(`topic-${sIdx}-${tIdx}`);
    detail.classList.toggle('open');
}

function expandAll() {
    document.querySelectorAll('.section-content').forEach(el => el.classList.add('open'));
    document.querySelectorAll('.topic-detail').forEach(el => el.classList.add('open'));
    document.querySelectorAll('.arrow').forEach(el => el.classList.add('open'));
}

function collapseAll() {
    document.querySelectorAll('.section-content').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.topic-detail').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.arrow').forEach(el => el.classList.remove('open'));
}

function updateProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
    const percent = Math.round((checked / checkboxes.length) * 100);
    document.getElementById('progressPercent').textContent = percent;
    document.getElementById('progressFill').style.width = percent + '%';
    saveProgress();
}

function saveProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const state = Array.from(checkboxes).map(cb => cb.checked);
    localStorage.setItem('senior-dotnet-progress', JSON.stringify(state));
}

function loadProgress() {
    const saved = localStorage.getItem('senior-dotnet-progress');
    if (saved) {
        const state = JSON.parse(saved);
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((cb, i) => { if (state[i]) cb.checked = true; });
        updateProgress();
    }
}

function resetProgress() {
    if (confirm('Bạn có chắc muốn reset toàn bộ tiến độ?')) {
        localStorage.removeItem('senior-dotnet-progress');
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateProgress();
    }
}

renderSections();
</script>
</body>
</html>
