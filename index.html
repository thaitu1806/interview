<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FullStack .NET Master Guide — Junior → Expert</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;line-height:1.6;color:#333;background:#f0f2f5;padding:16px}
.container{max-width:1300px;margin:0 auto}
h1{text-align:center;color:#1a237e;margin-bottom:6px;font-size:1.8em}
.subtitle{text-align:center;color:#666;margin-bottom:20px}
.stats-bar{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.stat{text-align:center;padding:12px 20px;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);min-width:110px}
.stat .num{font-size:1.7em;font-weight:700;color:#1a237e}
.stat .label{font-size:.8em;color:#666}
.progress-wrap{margin-bottom:20px}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.progress-row .plabel{width:70px;font-size:.85em;font-weight:600}
.progress-row .pbar{flex:1;height:12px;background:#e0e0e0;border-radius:6px;overflow:hidden}
.progress-row .pfill{height:100%;border-radius:6px;transition:width .3s}
.progress-row .ptext{width:40px;font-size:.8em;text-align:right}
.fill-junior{background:linear-gradient(90deg,#43a047,#66bb6a)}
.fill-senior{background:linear-gradient(90deg,#fb8c00,#ffb74d)}
.fill-expert{background:linear-gradient(90deg,#e53935,#ef5350)}
.controls{text-align:center;margin-bottom:16px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.88em;margin:3px;transition:all .2s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-green{background:#2e7d32;color:#fff}
.btn-orange{background:#e65100;color:#fff}
.btn-red{background:#b71c1c;color:#fff}
.btn-secondary{background:#e0e0e0;color:#333}
.btn-outline{background:#fff;border:2px solid #1a237e;color:#1a237e}
.btn.active{box-shadow:0 0 0 3px rgba(26,35,126,.3);transform:scale(1.05)}
.section{background:#fff;border-radius:10px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);overflow:hidden}
.sec-hd{padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:#fff;user-select:none}
.sec-hd:hover{opacity:.92}
.sec-hd h2{font-size:1.05em}
.sec-hd .arrow{transition:transform .3s}
.sec-hd .arrow.open{transform:rotate(180deg)}
.sec-bd{display:none;padding:0 20px 16px}
.sec-bd.open{display:block}
.card{border:1px solid #e8e8e8;border-radius:8px;margin-top:10px;overflow:hidden}
.card-hd{padding:10px 14px;background:#fafafa;display:flex;align-items:center;gap:8px;cursor:pointer}
.card-hd:hover{background:#f0f0f0}
.card-hd input[type=checkbox]{width:17px;height:17px;cursor:pointer}
.card-hd .tname{flex:1;font-weight:600;font-size:.92em}
.card-hd .tlv{font-size:.72em;padding:2px 7px;border-radius:4px;color:#fff}
.lv-junior{background:#43a047}
.lv-senior{background:#fb8c00}
.lv-expert{background:#e53935}
.card-bd{display:none;padding:12px 14px;border-top:1px solid #eee;font-size:.9em}
.card-bd.open{display:block}
.card-bd ul{padding-left:16px;margin-bottom:8px}
.card-bd li{margin-bottom:6px}
.card-bd li strong{color:#1a237e;font-weight:600}
.qa-wrap{margin-top:10px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden}
.qa-q{padding:10px 14px;background:#f5f5f5;cursor:pointer;font-weight:600;font-size:.9em;color:#1a237e}
.qa-q:hover{background:#ede7f6}
.qa-a{display:none;padding:14px;border-top:1px solid #e0e0e0}
.qa-a.open{display:block}
.ans-vi{background:#fce4ec;border-left:4px solid #d32f2f;padding:12px 14px;border-radius:6px;margin-bottom:12px}
.ans-vi strong{color:#c62828;display:block;margin-bottom:6px;font-size:.85em}
.ans-en{background:#e3f2fd;border-left:4px solid #1565c0;padding:12px 14px;border-radius:6px;margin-bottom:12px}
.ans-en strong{color:#0d47a1;display:block;margin-bottom:6px;font-size:.85em}
.smart-tip{background:#e8f5e9;border-left:4px solid #2e7d32;padding:12px 14px;border-radius:6px;font-size:.88em}
.smart-tip b{color:#1b5e20}
.code-block{background:#1e1e1e;color:#d4d4d4;padding:14px 16px;border-radius:6px;margin:10px 0;overflow-x:auto;font-family:'Cascadia Code',Consolas,'Fira Code',monospace;font-size:.82em;line-height:1.5;white-space:pre;border:1px solid #333}
.ans-vi p,.ans-en p{margin-bottom:8px}
.ans-vi ul,.ans-en ul{padding-left:18px;margin-bottom:8px}
.ans-vi li,.ans-en li{margin-bottom:4px}
.bg-1{background:linear-gradient(135deg,#512da8,#7c4dff)}
.bg-2{background:linear-gradient(135deg,#1565c0,#42a5f5)}
.bg-3{background:linear-gradient(135deg,#2e7d32,#66bb6a)}
.bg-4{background:linear-gradient(135deg,#e65100,#ff9800)}
.bg-5{background:linear-gradient(135deg,#00695c,#26a69a)}
.bg-6{background:linear-gradient(135deg,#c62828,#ef5350)}
.bg-7{background:linear-gradient(135deg,#4e342e,#8d6e63)}
.bg-8{background:linear-gradient(135deg,#1a237e,#5c6bc0)}
@media print{body{background:#fff}.controls,.stats-bar,.progress-wrap{display:none}.sec-bd,.card-bd,.qa-a{display:block!important}.section{break-inside:avoid}}
@media(max-width:768px){body{padding:10px}.stat{min-width:80px;padding:8px}.code-block{font-size:.75em;padding:10px}}
</style>
</head>
<body>
<div class="container">
<h1>🚀 FullStack .NET — Master Knowledge Map</h1>
<p class="subtitle">Junior → Senior → Expert | Checklist + Câu hỏi & Trả lời chi tiết song ngữ</p>
<div class="stats-bar">
<div class="stat"><div class="num" id="sTotal">0</div><div class="label">Tổng chủ đề</div></div>
<div class="stat"><div class="num" id="sChecked">0</div><div class="label">Đã học ✓</div></div>
<div class="stat"><div class="num" id="sQA">0</div><div class="label">Câu hỏi</div></div>
<div class="stat"><div class="num" id="sPct">0%</div><div class="label">Hoàn thành</div></div>
</div>
<div class="progress-wrap">
<div class="progress-row"><span class="plabel" style="color:#2e7d32">Junior</span><div class="pbar"><div class="pfill fill-junior" id="pJ"></div></div><span class="ptext" id="ptJ">0%</span></div>
<div class="progress-row"><span class="plabel" style="color:#e65100">Senior</span><div class="pbar"><div class="pfill fill-senior" id="pS"></div></div><span class="ptext" id="ptS">0%</span></div>
<div class="progress-row"><span class="plabel" style="color:#b71c1c">Expert</span><div class="pbar"><div class="pfill fill-expert" id="pE"></div></div><span class="ptext" id="ptE">0%</span></div>
</div>
<div class="controls">
<button class="btn btn-green" onclick="setLv('junior',this)">Junior</button>
<button class="btn btn-orange" onclick="setLv('senior',this)">Senior</button>
<button class="btn btn-red" onclick="setLv('expert',this)">Expert</button>
<button class="btn btn-primary active" onclick="setLv('all',this)">Tất cả</button>
<button class="btn btn-secondary" onclick="openAll()">Mở hết</button>
<button class="btn btn-secondary" onclick="closeAll()">Thu gọn</button>
<button class="btn btn-outline" onclick="resetAll()">Reset</button>
</div>
<div id="app"></div>
</div>
<!-- Data files -->
<script src="data/csharp-fundamentals.js"></script>
<script src="data/csharp-advanced.js"></script>
<script src="data/aspnet-core.js"></script>
<script src="data/architecture.js"></script>
<script src="data/database.js"></script>
<script src="data/system-design.js"></script>
<script src="data/real-world.js"></script>
<!-- App logic -->
<script>
var D = window.GUIDE_DATA || [];
var curLv = 'all', SK = 'dotnet-master-v5';

function gc(){try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}}
function sc(o){localStorage.setItem(SK,JSON.stringify(o))}

function stats(){
    var ck=gc(),tot=0,qa=0,chk=0,lv={junior:0,senior:0,expert:0},lvck={junior:0,senior:0,expert:0};
    D.forEach(function(s,si){s.items.forEach(function(it,ii){
        tot++;lv[it.l]++;if(it.q)qa++;if(ck[si+'-'+ii]){chk++;lvck[it.l]++}
    })});
    document.getElementById('sTotal').textContent=tot;
    document.getElementById('sChecked').textContent=chk;
    document.getElementById('sQA').textContent=qa;
    document.getElementById('sPct').textContent=tot?Math.round(chk/tot*100)+'%':'0%';
    ['junior','senior','expert'].forEach(function(l){
        var p=lv[l]?Math.round(lvck[l]/lv[l]*100):0;
        var id=l==='junior'?'J':l==='senior'?'S':'E';
        document.getElementById('p'+id).style.width=p+'%';
        document.getElementById('pt'+id).textContent=p+'%';
    });
}

function render(){
    var el=document.getElementById('app'),ck=gc(),html='';
    D.forEach(function(sec,si){
        var items=sec.items.filter(function(it){return curLv==='all'||it.l===curLv});
        if(!items.length)return;
        html+='<div class="section"><div class="sec-hd '+sec.c+'" onclick="tSec(this)"><h2>'+sec.t+'</h2><span class="arrow">\u25BC</span></div><div class="sec-bd">';
        items.forEach(function(it){
            var oi=sec.items.indexOf(it),key=si+'-'+oi;
            var lc='lv-'+it.l,lt=it.l==='junior'?'Junior':it.l==='senior'?'Senior':'Expert';
            var chd=ck[key]?'checked':'';
            html+='<div class="card"><div class="card-hd" onclick="tCard(this)"><input type="checkbox" '+chd+' onclick="event.stopPropagation();tChk(\''+key+'\',this)"><span class="tname">'+it.n+'</span><span class="tlv '+lc+'">'+lt+'</span></div><div class="card-bd"><ul>';
            it.p.forEach(function(p){
                if(typeof p==='object'){html+='<li><strong>'+p.t+':</strong> '+p.d+'</li>'}
                else{html+='<li>'+p+'</li>'}
            });
            html+='</ul>';
            if(it.q){
                html+='<div class="qa-wrap"><div class="qa-q" onclick="tQA(this)">\u2753 '+it.q+'</div><div class="qa-a">';
                html+='<div class="ans-vi"><strong>\ud83c\uddfb\ud83c\uddf3 Ti\u1ebfng Vi\u1ec7t</strong>'+it.vi+'</div>';
                html+='<div class="ans-en"><strong>\ud83c\uddec\ud83c\udde7 English</strong>'+it.en+'</div>';
                if(it.tip)html+='<div class="smart-tip"><b>\ud83d\udca1 M\u1eb9o tr\u1ea3 l\u1eddi:</b> '+it.tip+'</div>';
                html+='</div></div>';
            }
            html+='</div></div>';
        });
        html+='</div></div>';
    });
    el.innerHTML=html;stats();
}

function tSec(h){h.nextElementSibling.classList.toggle('open');h.querySelector('.arrow').classList.toggle('open')}
function tCard(h){h.nextElementSibling.classList.toggle('open')}
function tQA(h){h.nextElementSibling.classList.toggle('open')}
function tChk(k,cb){var o=gc();o[k]=cb.checked;sc(o);stats()}
function setLv(l,btn){curLv=l;document.querySelectorAll('.controls .btn').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');render()}
function openAll(){document.querySelectorAll('.sec-bd').forEach(function(e){e.classList.add('open')});document.querySelectorAll('.card-bd').forEach(function(e){e.classList.add('open')});document.querySelectorAll('.qa-a').forEach(function(e){e.classList.add('open')});document.querySelectorAll('.arrow').forEach(function(e){e.classList.add('open')})}
function closeAll(){document.querySelectorAll('.sec-bd').forEach(function(e){e.classList.remove('open')});document.querySelectorAll('.card-bd').forEach(function(e){e.classList.remove('open')});document.querySelectorAll('.qa-a').forEach(function(e){e.classList.remove('open')});document.querySelectorAll('.arrow').forEach(function(e){e.classList.remove('open')})}
function resetAll(){if(confirm('Reset to\u00e0n b\u1ed9 ti\u1ebfn \u0111\u1ed9?')){localStorage.removeItem(SK);render()}}
render();
</script>
</body>
</html>
